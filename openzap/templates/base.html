<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OpenZap{% endblock %} · OpenZap</title>
<link rel="icon" href="{{ root_path }}/static/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1e2230;
    --border: #2a2f3f;
    --text: #e6e9f0;
    --muted: #9aa3b5;
    --accent: #7c5cff;
    --accent-2: #4f46e5;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  a { color: #a78bfa; text-decoration: none; }
  a:hover { text-decoration: underline; }
  header.top {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 24px;
    background: linear-gradient(90deg, #171a23, #1b1f2b);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  header.top img { width: 28px; height: 28px; }
  header.top .brand { font-weight: 700; font-size: 17px; letter-spacing: .2px; }
  header.top .brand span { color: var(--muted); font-weight: 400; }
  header.top nav { margin-left: auto; display: flex; gap: 18px; font-size: 14px; }
  header.top nav a { color: var(--muted); }
  header.top nav a.active, header.top nav a:hover { color: var(--text); text-decoration: none; }
  main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 72px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  h2 { font-size: 17px; margin: 28px 0 10px; }
  .lede { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .grid { display: grid; gap: 14px; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .card .v { font-size: 26px; font-weight: 700; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  tr:last-child td { border-bottom: none; }
  code, pre, .mono { font-family: var(--mono); }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  pre { background: #0c0e14; border: 1px solid var(--border); border-radius: 8px; padding: 14px; overflow: auto; font-size: 12.5px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.ok { background: rgba(34,197,94,.14); color: var(--ok); }
  .pill.err { background: rgba(239,68,68,.14); color: var(--err); }
  .pill.off { background: rgba(154,163,181,.14); color: var(--muted); }
  .pill.warn { background: rgba(245,158,11,.14); color: var(--warn); }
  .btn {
    display: inline-block; padding: 6px 12px; border-radius: 7px; font-size: 13px;
    background: var(--accent-2); color: #fff; border: 1px solid transparent; cursor: pointer;
  }
  .btn:hover { text-decoration: none; filter: brightness(1.1); }
  .btn.ghost { background: transparent; border-color: var(--border); color: var(--text); }
  .btn.danger { background: transparent; border-color: rgba(239,68,68,.4); color: var(--err); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .hook { font-family: var(--mono); font-size: 12px; word-break: break-all; }
  form.filter { display: flex; gap: 8px; align-items: end; margin-bottom: 16px; flex-wrap: wrap; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select, textarea {
    background: #0c0e14; color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 9px; font-size: 13.5px; font-family: inherit;
  }
  textarea.code { font-family: var(--mono); font-size: 12.5px; width: 100%; min-height: 340px; }
  .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
  .flash.ok { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.35); }
  .flash.err { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.35); }
  details.step { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
  details.step summary { cursor: pointer; font-size: 13.5px; }
  footer { color: var(--muted); font-size: 12.5px; text-align: center; padding: 24px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<header class="top">
  <img src="{{ root_path }}/static/favicon.svg" alt="">
  <div class="brand">OpenZap <span>· self-hosted automation</span></div>
  <nav>
    <a href="{{ root_path }}/" {% if active == 'dashboard' %}class="active"{% endif %}>Workflows</a>
    <a href="{{ root_path }}/runs" {% if active == 'history' %}class="active"{% endif %}>Run history</a>
    <a href="{{ root_path }}/workflows/new" {% if active == 'editor' %}class="active"{% endif %}>New workflow</a>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer>OpenZap &mdash; workflow automation that lives on your infrastructure.</footer>
</body>
</html>
