[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openzap"
version = "0.1.0"
description = "OpenZap - a lightweight, self-hosted workflow automation engine. Wire triggers to actions in JSON."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anas Shaikh", email = "anas@0xshaikh.dev" }]
requires-python = ">=3.10"
keywords = [
    "automation",
    "workflow",
    "webhook",
    "zapier-alternative",
    "self-hosted",
    "cron",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Integration",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "APScheduler>=3.10,<4",
    "requests>=2.32",
    "Jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.scripts]
openzap = "openzap.cli:main"

[project.urls]
Homepage = "https://github.com/0xshaikh/openzap"
Repository = "https://github.com/0xshaikh/openzap"
Issues = "https://github.com/0xshaikh/openzap/issues"

[tool.setuptools.packages.find]
include = ["openzap*"]

[tool.setuptools.package-data]
openzap = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:apscheduler.*",
]
